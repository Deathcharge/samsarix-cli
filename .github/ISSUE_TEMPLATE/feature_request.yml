name: Feature request
description: Propose a focused improvement to the offline scaffolding workflow.
title: "feature: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user workflow is difficult or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe observable behavior, not only an implementation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: boundary
    attributes:
      label: Product boundary
      options:
        - label: The proposal can remain offline and inspectable.
          required: true
        - label: The proposal does not require executing template-supplied code.
          required: true
