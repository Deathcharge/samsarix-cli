name: CI

on:
  pull_request:
  push:
    branches: [master, "codex/**"]
    tags: ["v*"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip "setuptools>=83,<84"
          python -m pip install -e ".[dev]"
      - name: Format
        run: ruff format --check .
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy
      - name: Test
        run: pytest --cov=samsarix_cli --cov-report=term-missing
      - name: Audit dependencies
        run: pip-audit --local --skip-editable

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip "setuptools>=83,<84"
          python -m pip install "build>=1.2,<2" "twine>=6,<7"
      - name: Build distributions
        run: python -m build
      - name: Check distribution metadata
        run: python -m twine check dist/*
      - name: Verify source distribution contents
        run: |
          python - <<'PY'
          import glob
          import tarfile

          archive = glob.glob("dist/*.tar.gz")[0]
          with tarfile.open(archive) as source:
              names = source.getnames()
          required = "examples/team-service/samsarix-template.toml"
          if not any(name.endswith(required) for name in names):
              raise SystemExit(f"{required} is missing from {archive}")
          PY
      - name: Install and exercise the wheel
        run: |
          python -m venv .wheel-venv
          .wheel-venv/bin/python -m pip install dist/*.whl
          .wheel-venv/bin/samsarix --help
          .wheel-venv/bin/samsarix init "$RUNNER_TEMP/samsarix-smoke" --no-git
          .wheel-venv/bin/samsarix check "$RUNNER_TEMP/samsarix-smoke"
          .wheel-venv/bin/samsarix inspect-template examples/team-service --json
          .wheel-venv/bin/samsarix plan "$RUNNER_TEMP/samsarix-team-smoke" --template-pack examples/team-service --no-git --json
          .wheel-venv/bin/samsarix init "$RUNNER_TEMP/samsarix-team-smoke" --template-pack examples/team-service --no-git
          .wheel-venv/bin/samsarix check "$RUNNER_TEMP/samsarix-team-smoke" --strict
          python -m venv "$RUNNER_TEMP/generated-venv"
          "$RUNNER_TEMP/generated-venv/bin/python" -m pip install -e "$RUNNER_TEMP/samsarix-team-smoke[dev]"
          "$RUNNER_TEMP/generated-venv/bin/python" -m pytest "$RUNNER_TEMP/samsarix-team-smoke/tests"
          "$RUNNER_TEMP/generated-venv/bin/python" -m ruff format --check "$RUNNER_TEMP/samsarix-team-smoke"
          "$RUNNER_TEMP/generated-venv/bin/python" -m ruff check "$RUNNER_TEMP/samsarix-team-smoke"
