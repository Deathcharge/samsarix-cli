[build-system]
requires = ["setuptools>=83,<84", "wheel>=0.45,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "samsarix-cli"
dynamic = ["version"]
description = "Offline generator for independent, runnable Python project starters"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "TRADEMARKS.md"]
authors = [
    {name = "Samsarix LLC", email = "contact@samsarix.com"},
]
maintainers = [
    {name = "Samsarix Support", email = "support@samsarix.com"},
]
keywords = ["cli", "project-template", "python", "samsarix", "scaffolding"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.1,<9",
]

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "mypy>=1.10,<2",
    "pip-audit>=2.9,<3",
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.11,<1",
    "twine>=6,<7",
]

[project.scripts]
samsarix = "samsarix_cli.main:cli"

[project.urls]
Repository = "https://github.com/Deathcharge/samsarix-cli"
Issues = "https://github.com/Deathcharge/samsarix-cli/issues"

[tool.setuptools.dynamic]
version = {attr = "samsarix_cli.__version__"}

[tool.setuptools.packages.find]
include = ["samsarix_cli*"]
namespaces = false

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["samsarix_cli"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
extend-exclude = ["examples/*/template"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["samsarix_cli", "tests"]
