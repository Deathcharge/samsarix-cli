[build-system]
requires = ["setuptools>=83,<84", "wheel>=0.45,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "helix-cli"
dynamic = ["version"]
description = "Offline generator for independent, runnable Python project starters"
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Helix-Source-Available"
license-files = ["LICENSE", "LICENSE.PROPRIETARY"]
authors = [
    {name = "Helix Collective"},
]
keywords = ["cli", "project-template", "python", "scaffolding"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.1,<9",
]

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "mypy>=1.10,<2",
    "pip-audit>=2.9,<3",
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.11,<1",
    "twine>=6,<7",
]

[project.scripts]
helix = "helix_cli.main:cli"

[project.urls]
Repository = "https://github.com/Deathcharge/helix-cli"
Issues = "https://github.com/Deathcharge/helix-cli/issues"

[tool.setuptools.dynamic]
version = {attr = "helix_cli.__version__"}

[tool.setuptools.packages.find]
include = ["helix_cli*"]
namespaces = false

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["helix_cli"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["helix_cli", "tests"]
